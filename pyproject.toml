[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computer-agent"
version = "0.3.2"
description = "A permission-gated Windows desktop agent with local and cloud model support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "PySide6>=6.7,<7",
  "pyautogui>=0.9.54,<1",
  "Pillow>=10,<12",
  "python-dotenv>=1.0,<2",
  "keyring>=25,<26",
  "uiautomation>=2.0,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
browser = ["playwright>=1.45,<2"]

[project.scripts]
computer-agent = "computer_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
