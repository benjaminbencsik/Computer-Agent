name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: pip install . pyinstaller

      - name: Build Windows application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name ComputerAgent
          --paths src
          --collect-all pyautogui
          launcher.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc packaging/computer-agent.iss

      - name: Create installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist-installer/ComputerAgent-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ComputerAgent-Setup.exe" | Set-Content -Encoding ascii dist-installer/ComputerAgent-Setup.exe.sha256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerAgent-Windows
          path: |
            dist-installer/ComputerAgent-Setup.exe
            dist-installer/ComputerAgent-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish current public release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.2 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.2 dist-installer/ComputerAgent-Setup.exe dist-installer/ComputerAgent-Setup.exe.sha256 `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "Computer Agent v0.3.2" `
              --notes "Download ComputerAgent-Setup.exe, open it, and follow the installer. Git and Python are not required."
          }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/ComputerAgent-Setup.exe
            dist-installer/ComputerAgent-Setup.exe.sha256
          generate_release_notes: true
